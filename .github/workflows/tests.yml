name: Offline framework checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python scripts/bootstrap.py
      - run: python scripts/check_share.py
      - run: python -m pytest -q
      - run: python -m pytest -q integrations/jiuwenswarm/pr_files/tests/unit_tests/common
      - run: python scripts/verify_projects_v5.py --output projects/ci-fixtures
      - run: python -m research_lab discover init projects/ci-open-topic --config config/projects/open-topic-fixture.json
      - run: python -m research_lab discover run projects/ci-open-topic --fixture
      - run: python -c "import json; s=json.load(open('projects/ci-open-topic/autonomy-state.json',encoding='utf-8')); assert s['status']=='completed' and s['fixture_only'] and s['model_calls']==0"
